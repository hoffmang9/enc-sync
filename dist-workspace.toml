[workspace]
members = ["cargo:."]

# Release customization lives in scripts/ and global-artifacts-jobs workflows.
#
# Universal macOS: cargo-dist has no native lipo support (axodotdev/cargo-dist#77).
# dist.toml lists per-arch *-apple-darwin targets; release-postbuild.yml runs
# combine-macos-universal.sh then prepare-release-bundle.sh.
#
# allow-dirty = ["ci"] tells cargo-dist it may skip regenerating release.yml when
# that file differs from the template. Run ./scripts/verify-release-workflow-patches.rb
# after `dist generate` to confirm required hunks are still present.
#
# After `dist generate`, re-apply release.yml patches (or restore from git):
#   - on: workflow_dispatch (pr_number input) + push tags; not pull_request (CI dispatches)
#   - plan: require-ci-success-on-commit.sh on tag push; release_version + release-version.sh
#   - plan outputs: publishing/tag/tag-flag use github.event_name == 'push'
#   - build-global: if publishing == true; upload artifacts-dist-manifests
#   - custom-release-postbuild: replaces separate mac + finalize jobs
#   - release-postbuild: macOS universal first; PR finalize waits for full CI before bundling
#   - cleanup-workflow-artifacts: tag releases only; DELETE_ALL after host
#   - host: manifest fetches; ./scripts/create-github-release.sh
#   - report-pr-release-status job; plan pending status; permissions statuses: write
#   - omit announce job
#
# Tag releases run Release on tag push after verifying CI succeeded on that commit.
# Git tags use bare semver (1.0.0-rc1), matching Cargo.toml — not v-prefixed names.
[dist]
cargo-dist-version = "0.32.0"
ci = "github"
hosting = "github"
installers = []
merge-tasks = true
pr-run-mode = "upload"
allow-dirty = ["ci"]
global-artifacts-jobs = ["./release-postbuild"]

[dist.github-custom-runners]
x86_64-apple-darwin = "macos-14"
aarch64-apple-darwin = "macos-14"
