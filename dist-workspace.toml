[workspace]
members = ["cargo:."]

# Workspace-level cargo-dist settings. Package build targets live in dist.toml.
# After `dist generate`, preserve the macOS universal merge step in release.yml.
[dist]
cargo-dist-version = "0.32.0"
ci = "github"
hosting = "github"
installers = []
merge-tasks = true
allow-dirty = ["ci"]

[dist.github-custom-runners]
x86_64-apple-darwin = "macos-14"
aarch64-apple-darwin = "macos-14"
