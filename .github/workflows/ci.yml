name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Verify release workflow patches
        run: ruby ./scripts/verify-release-workflow-patches.rb

      - name: Clippy
        env:
          RUSTFLAGS: -W rust-2024-compatibility
        run: cargo clippy --all-targets --locked --features test-helpers -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    needs: lint
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-22.04-arm, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        env:
          RUSTFLAGS: -W rust-2024-compatibility
        run: cargo test --locked --features test-helpers

  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: always()
    steps:
      - name: Verify required jobs
        run: |
          test "${{ needs.lint.result }}" = "success"
          test "${{ needs.test.result }}" = "success"

  trigger-release:
    name: Trigger release build
    needs: lint
    if: >-
      github.event_name == 'pull_request' &&
      needs.lint.result == 'success' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      statuses: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const sha = context.payload.pull_request.head.sha;
            const statusBase = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              context: 'release/enc-sync',
            };

            await github.rest.repos.createCommitStatus({
              ...statusBase,
              state: 'pending',
              description: 'Release build queued',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/workflows/release.yml`,
            });

            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'release.yml',
              ref: context.payload.pull_request.head.ref,
              inputs: {
                pr_number: String(context.payload.pull_request.number),
              },
            });
