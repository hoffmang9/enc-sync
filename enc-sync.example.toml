# enc-sync configuration
#
# Local use (preferred when working in a checkout or project directory):
#   cp enc-sync.example.toml enc-sync.toml
#
# Machine-wide default (typical for cron):
#   mkdir -p ~/.enc-sync && cp enc-sync.example.toml ~/.enc-sync/config.toml
#
# If --config is omitted, enc-sync loads ./enc-sync.toml first, then
# ~/.enc-sync/config.toml.
#
# NOAA publishes ENC updates every weekday evening. Example cron:
#   0 23 * * 1-5 enc-sync --config ~/.enc-sync/config.toml \
#     >>/tmp/enc-sync.log 2>&1

# OpenCPN BaseChartDir (the parent of ENC/). Charts sync into subfolders that
# mirror Chart Downloader defaults, e.g. ENC/US_CA, ENC/US_OR, ENC/US_REGION14.
chart_dir = "~/Documents/Charts"

# Select which OpenCPN chart folders to sync. A folder is included when it
# matches ANY non-empty list below.
states = ["CA", "OR", "WA"]
regions = []                 # e.g. "14", "15" → ENC/US_REGION14
coast_guard_districts = []     # e.g. "13" → ENC/US_CGD13

# Optional extras (off by default):
# all_enc = true               # also sync ENC/US (national catalog)
# inland = true                # US Army Corps: US_INLAND, US_INLAND_BUOYS, US_INLAND_OVERLAYS

# When all filters above are empty and both flags are false, enc-sync discovers
# existing recognized ENC/* folders under chart_dir and syncs those.

# After a successful download, quit and relaunch OpenCPN.
restart_opencpn = true
rebuild_chart_db = true
