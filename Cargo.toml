[package]
name = "enc-sync"
version = "0.1.0"
edition = "2021"
description = "Sync NOAA ENC charts for OpenCPN with optional area filters"
license = "Apache-2.0"

[lib]
name = "enc_sync"
path = "src/lib.rs"

[[bin]]
name = "enc-sync"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["std"] }
log = "0.4"
env_logger = "0.11"
quick-xml = "0.37"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
ureq = { version = "3", features = ["rustls"] }
zip = "2"
filetime = "0.2"
shellexpand = "3"

[dev-dependencies]
tempfile = "3"
tiny_http = "0.12"
