[package]
name = "enc-sync"
version = "1.0.0-rc1"
edition = "2021"
description = "Sync NOAA ENC charts for OpenCPN with optional area filters"
license = "Apache-2.0"
repository = "https://github.com/hoffmang9/enc-sync"

[features]
test-helpers = []

[lib]
name = "enc_sync"
path = "src/lib.rs"

[[bin]]
name = "enc-sync"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["std"] }
log = "0.4"
env_logger = "0.11"
quick-xml = "0.37"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
ureq = { version = "3", features = ["rustls"] }
zip = "2"
filetime = "0.2"
shellexpand = "3"
dirs = "6"
tempfile = "3"

[build-dependencies]
quick-xml = "0.37"

[dev-dependencies]
tiny_http = "0.12"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
